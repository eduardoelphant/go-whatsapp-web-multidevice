name: Elphant image

on:
  push:
    tags:
      - "v*-elphant.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag to build (e.g. v9.5.0-elphant.1)"
        required: true
      force:
        description: "Rebuild even if the image tag already exists"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/eduardoelphant/gowa
  TAG: ${{ inputs.tag || github.ref_name }}
  FORCE: ${{ inputs.force || false }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-elphant\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z-elphant.N"
            exit 1
          fi
          # Published tags are immutable: rollbacks must pull the same bits.
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; dispatch with force to rebuild it"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Vet and test
        working-directory: src
        run: |
          go vet ./...
          go test ./...

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/golang.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Create the multi-arch manifest
        run: docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
